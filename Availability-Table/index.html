<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Availability Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>Team Availability Dashboard</h1>
  <p class="subtitle">
    Weekly availability of developers for sprint planning.
  </p>

  <table>
    <tr>
      <th>Time</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>
    </tr>

    <tr class="sharp">
      <th class="time">09:00</th>
      <td class="available-5"></td>
      <td class="available-4"></td>
      <td class="available-5"></td>
      <td class="available-3"></td>
      <td class="available-2"></td>
    </tr>

    <tr class="half">
      <th class="time">11:00</th>
      <td class="available-3"></td>
      <td class="available-2"></td>
      <td class="available-4"></td>
      <td class="available-5"></td>
      <td class="available-1"></td>
    </tr>

    <tr class="sharp">
      <th class="time">02:00 PM</th>
      <td class="available-1"></td>
      <td class="available-3"></td>
      <td class="available-2"></td>
      <td class="available-4"></td>
      <td class="available-5"></td>
    </tr>

    <tr class="half">
      <th class="time">04:00 PM</th>
      <td class="available-0"></td>
      <td class="available-2"></td>
      <td class="available-3"></td>
      <td class="available-4"></td>
      <td class="available-5"></td>
    </tr>
  </table>

  <div id="legend">
    <span>Availability</span>
    <div id="legend-gradient"></div>
  </div>

</div>

</body>
</html>
