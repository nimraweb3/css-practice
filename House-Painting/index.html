<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Sweet Home — A Dusk Cottage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="scene">

    <div class="sky" aria-hidden="true">
      <div class="moon"></div>
      <span class="star s1"></span>
      <span class="star s2"></span>
      <span class="star s3"></span>
      <span class="star s4"></span>
      <span class="star s5"></span>
      <span class="star s6"></span>
      <span class="star s7"></span>
      <span class="star s8"></span>
    </div>

    <header class="title-block">
      <p class="eyebrow">a little painted place, hand&#8209;built in CSS</p>
      <h1>Home&nbsp;Sweet&nbsp;Home</h1>
    </header>

    <div id="house">
      <div id="chimney"></div>
      <div id="roof"></div>
      <div id="window-1"></div>
      <div id="window-2"></div>
      <div id="door"></div>
    </div>

    <div class="ground" aria-hidden="true">
      <span class="blade b1"></span>
      <span class="blade b2"></span>
      <span class="blade b3"></span>
      <span class="blade b4"></span>
      <span class="blade b5"></span>
      <span class="blade b6"></span>
    </div>

  </main>

</body>
</html>
